
name: 02 - Build & Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Strict Tag Name (NO SPACES! e.g., v2.0.0)'
        required: true
        default: 'v2.0.0'
      release_title:
        description: 'Display Title (Can include spaces/Arabic! e.g., الحمد لله رب العالمين)'
        required: true
        default: 'الحمد لله رب العالمين'

permissions:
  contents: write

jobs:
  # ==========================================
  # BUILD ANDROID
  # ==========================================
  build_android:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Model Assets
        shell: bash
        run: |
          echo "Checking assets/model..."

          if [ ! -d "assets/model" ]; then
            echo "ERROR: Folder assets/model tidak ditemukan!"
            exit 1
          fi

          if ! find assets/model -type f -iname "*.onnx" -print -quit | grep -q .; then
            echo "ERROR: File ONNX tidak ditemukan di assets/model!"
            exit 1
          fi

          echo "Model files found:"
          find assets/model -type f -printf '%p (%s bytes)\n'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ReciteQuran-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ReciteQuran-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk ReciteQuran-x86_64.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            ReciteQuran-arm64-v8a.apk
            ReciteQuran-armeabi-v7a.apk
            ReciteQuran-x86_64.apk
          retention-days: 1

  # ==========================================
  # BUILD WINDOWS
  # ==========================================
  build_windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Model Assets
        shell: pwsh
        run: |
          Write-Host "Checking assets/model..."

          if (!(Test-Path "assets\model")) {
            throw "ERROR: Folder assets\model tidak ditemukan!"
          }

          $models = Get-ChildItem "assets\model" -Filter "*.onnx" -File -Recurse

          if ($models.Count -eq 0) {
            throw "ERROR: File ONNX tidak ditemukan di assets\model!"
          }

          Write-Host "Model files found:"
          Get-ChildItem "assets\model" -File -Recurse |
            ForEach-Object {
              Write-Host "$($_.FullName) ($($_.Length) bytes)"
            }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Windows Build
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath ReciteQuran_Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ReciteQuran_Windows.zip
          retention-days: 1

  # ==========================================
  # PUBLISH GITHUB RELEASE
  # ==========================================
  publish_release:
    name: Publish Unified GitHub Release
    needs: [build_android, build_windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release_assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version_tag }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.release_title }}
          draft: false
          prerelease: false
          files: release_assets/*
